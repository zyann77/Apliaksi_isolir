<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NET//ISOLATOR</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Scanline Overlay -->
    <div class="scanline"></div>

    <!-- Splash Screen -->
    <div id="splash" class="view active">
        <div class="terminal-text" id="splash-terminal"></div>
        <div class="brand-center hidden" id="splash-brand">
            <h1 class="neon-title">NET//ISOLATOR</h1>
            <p class="subtitle">MIKROTIK CUSTOMER CONTROL</p>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-view" class="view hidden">
        <div class="login-box cyber-card">
            <h2 class="neon-title">SECURE ACCESS</h2>
            <div class="input-group">
                <label>USERNAME</label>
                <div class="input-wrapper">
                    <span>></span>
                    <input type="text" id="login-user" placeholder="__________________">
                </div>
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <div class="input-wrapper">
                    <span>></span>
                    <input type="password" id="login-pass" placeholder="__________________">
                </div>
            </div>
            <button class="cyber-btn" onclick="app.login()">[ ACCESS SYSTEM ]</button>
            <div id="login-status" class="terminal-font mt-4">SYSTEM: WAITING FOR AUTHENTICATION...</div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="main-app" class="view hidden">
        <header class="app-header">
            <div class="brand">
                <h1>NET//ISOLATOR</h1>
                <div class="status-indicator">
                    <span class="pulse-dot"></span> SYSTEM ONLINE
                </div>
            </div>
        </header>

        <main class="app-content">
            <!-- Dashboard View -->
            <section id="dashboard" class="page active">
                <div class="stats-grid">
                    <div class="stat-card cyber-card">
                        <div class="stat-label">TOTAL CLIENT</div>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                    <div class="stat-card cyber-card">
                        <div class="stat-label text-neon">ACTIVE</div>
                        <div class="stat-value text-neon" id="stat-active">0</div>
                    </div>
                    <div class="stat-card cyber-card">
                        <div class="stat-label text-warning">WARNING</div>
                        <div class="stat-value text-warning" id="stat-warning">0</div>
                    </div>
                    <div class="stat-card cyber-card">
                        <div class="stat-label text-danger">ISOLATED</div>
                        <div class="stat-value text-danger" id="stat-isolated">0</div>
                    </div>
                </div>

                <div class="terminal-monitor cyber-card mt-4">
                    <div class="terminal-header">SYSTEM LOG</div>
                    <div class="terminal-body" id="system-log">
                        <!-- Logs injected via JS -->
                    </div>
                </div>
            </section>

            <!-- Other views (Clients, Payments, etc.) will be toggled here -->
            <section id="clients" class="page hidden">
                <div class="search-bar cyber-card">
                    <span>> SEARCH CLIENT...</span>
                    <input type="text" placeholder="Name, ID, PPPoE...">
                </div>
                <!-- Client list injected here -->
            </section>
        </main>

        <footer class="app-footer">
            <p>Created by Iyann</p>
        </footer>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="app.navigate('dashboard')">⌂ HOME</button>
            <button class="nav-item" onclick="app.navigate('clients')">◉ CLIENT</button>
            <button class="nav-item" onclick="app.navigate('payments')">₿ PAYMENT</button>
            <button class="nav-item text-neon" onclick="app.navigate('isolation')">⚡ ISOLATION</button>
            <button class="nav-item" onclick="app.navigate('system')">⚙ SYSTEM</button>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
