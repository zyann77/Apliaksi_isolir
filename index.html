<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NET//ISOLATOR</title>
    
    <!-- PASTIKAN BARIS INI BENAR -->
    <link rel="stylesheet" href="./css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Scanline Overlay -->
    <div class="scanline"></div>

    <!-- Splash Screen -->
    <div id="splash" class="view active">
        <div class="terminal-text" id="splash-terminal"></div>
        <div class="brand-center hidden" id="splash-brand">
            <h1 class="neon-title">NET//ISOLATOR</h1>
            <p class="subtitle">MIKROTIK CUSTOMER CONTROL</p>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-view" class="view hidden">
        <div class="login-box cyber-card">
            <h2 class="neon-title">SECURE ACCESS</h2>
            <div class="input-group">
                <label>USERNAME</label>
                <div class="input-wrapper">
                    <span>></span>
                    <input type="text" id="login-user" placeholder="__________________">
                </div>
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <div class="input-wrapper">
                    <span>></span>
                    <input type="password" id="login-pass" placeholder="__________________">
                </div>
            </div>
            <button class="cyber-btn" onclick="app.login()">[ ACCESS SYSTEM ]</button>
            <div id="login-status" class="terminal-font mt-4">SYSTEM: WAITING FOR AUTHENTICATION...</div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="main-app" class="view hidden">
        <header class="app-header">
            <div class="brand">
                <h1>NET//ISOLATOR</h1>
                <div class="status-indicator">
                    <span class="pulse-dot"></span> SYSTEM ONLINE
                </div>
            </div>
        </header>

        <!-- Form Tambah Pelanggan -->
<section id="add-client" class="page hidden">
    <div class="cyber-card">
        <div class="terminal-header mb-4">
            <span class="pulse-dot"></span> SYSTEM // NEW_CLIENT_ENTRY
        </div>
        
        <form id="form-add-client" onsubmit="customers.save(event)">
            
            <!-- NAMA -->
            <div class="input-group">
                <label>NAMA PELANGGAN</label>
                <div class="input-wrapper">
                    <span class="text-neon">></span>
                    <input type="text" id="input-nama" placeholder="ENTER NAME..." required autocomplete="off">
                </div>
            </div>

            <!-- SECRET (PPPoE) -->
            <div class="input-group">
                <label>PPP SECRET (USERNAME)</label>
                <div class="input-wrapper">
                    <span class="text-neon">></span>
                    <input type="text" id="input-secret" placeholder="PPPOE USERNAME..." required autocomplete="off">
                </div>
            </div>
            
            <div class="input-group">
                <label>PPP PASSWORD</label>
                <div class="input-wrapper">
                    <span class="text-neon">></span>
                    <input type="password" id="input-password" placeholder="••••••••" required>
                    <button type="button" class="btn-icon" onclick="customers.togglePassword()">👁</button>
                </div>
            </div>

            <!-- TANGGAL REGISTRASI -->
            <div class="input-group">
                <label>TANGGAL REGISTRASI</label>
                <div class="input-wrapper">
                    <span class="text-neon">></span>
                    <input type="date" id="input-reg-date" required>
                </div>
            </div>

            <!-- TANGGAL ISOLIR -->
            <div class="input-group">
                <label>TANGGAL ISOLIR (1 - 31)</label>
                <div class="input-wrapper">
                    <span class="text-neon">></span>
                    <input type="number" id="input-iso-date" min="1" max="31" placeholder="DAY OF MONTH..." required>
                </div>
                <small class="terminal-font text-dim mt-1 d-block">Sistem akan otomatis isolir pada tanggal ini setiap bulan jika belum lunas.</small>
            </div>

            <!-- SUBMIT ACTION -->
            <button type="submit" class="cyber-btn mt-4 w-100" id="btn-save-client">
                [ EXECUTE: SAVE_CLIENT ]
            </button>
        </form>

        <!-- LOG TERMINAL UNTUK STATUS SIMPAN -->
        <div id="save-status-log" class="terminal-font mt-4 text-neon hidden">
            <!-- Pesan sukses/error muncul di sini -->
        </div>
    </div>
</section>

            <!-- Other views (Clients, Payments, etc.) will be toggled here -->
            <section id="clients" class="page hidden">
                <div class="search-bar cyber-card">
                    <span>> SEARCH CLIENT...</span>
                    <input type="text" placeholder="Name, ID, PPPoE...">
                </div>
                <!-- Client list injected here -->
            </section>
        </main>

        <footer class="app-footer">
            <p>Created by Iyann</p>
        </footer>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="app.navigate('dashboard')">⌂ HOME</button>
            <button class="nav-item" onclick="app.navigate('clients')">◉ CLIENT</button>
            <button class="nav-item" onclick="app.navigate('payments')">₿ PAYMENT</button>
            <button class="nav-item text-neon" onclick="app.navigate('isolation')">⚡ ISOLATION</button>
            <button class="nav-item" onclick="app.navigate('system')">⚙ SYSTEM</button>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
