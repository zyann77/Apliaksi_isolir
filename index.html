<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Auto Isolir ISP</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font SF Pro / Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icon Premium -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <!-- Header Glassmorphism -->
        <header class="glass-header">
            <div class="greeting">
                <p id="tanggal-hari-ini">Memuat tanggal...</p>
                <h2>Halo, Admin 👋</h2>
            </div>
            <div class="status-koneksi">
                <span class="dot pulse-green"></span> Online
            </div>
        </header>

        <!-- Main Content (Dashboard) -->
        <main class="content-area">
            <div class="stats-grid">
                <div class="stat-card glass-card">
                    <ion-icon name="people" class="icon-blue"></ion-icon>
                    <h3 id="total-pelanggan">0</h3>
                    <p>Total Pelanggan</p>
                </div>
                <div class="stat-card glass-card">
                    <ion-icon name="warning" class="icon-orange"></ion-icon>
                    <h3 id="total-terlambat">0</h3>
                    <p>Telat Bayar</p>
                </div>
            </div>

            <div class="section-title">
                <h3>Daftar Pelanggan</h3>
            </div>
            
            <div class="search-bar glass-card">
                <ion-icon name="search"></ion-icon>
                <input type="text" id="search-input" placeholder="Cari username PPPoE...">
            </div>

            <!-- List Pelanggan -->
            <div id="customer-list" class="customer-list">
                <!-- Data akan dimunculkan oleh JavaScript -->
            </div>
        </main>

        <!-- Bottom Navigation ala iOS -->
        <nav class="bottom-nav glass-nav">
            <a href="#" class="nav-item active">
                <ion-icon name="home"></ion-icon>
                <span>Beranda</span>
            </a>
            <a href="#" class="nav-item">
                <ion-icon name="people"></ion-icon>
                <span>Pelanggan</span>
            </a>
            <a href="#" class="nav-item">
                <ion-icon name="wallet"></ion-icon>
                <span>Tagihan</span>
            </a>
            <a href="#" class="nav-item">
                <ion-icon name="settings"></ion-icon>
                <span>Sistem</span>
            </a>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
