<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NET//CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Dasar Langsung Digabung Agar Pasti Jalan */
        :root { --bg-color: #f4f6f8; --card-bg: #ffffff; --text-main: #1e293b; --primary: #10b981; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }
        .login-box { margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .login-box h1 { color: var(--text-main); }
        .login-box h1 span { color: var(--primary); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .app-header { display: flex; justify-content: space-between; padding: 15px; background: white; border-bottom: 1px solid var(--border); }
        .app-content { flex: 1; padding: 15px; overflow-y: auto; }
        #btn-logout { background: #ef4444; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold;}
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>NET<span>//</span>CONTROL</h1>
            <p style="color: gray; margin-bottom: 20px; font-size: 14px;">Admin Management System</p>
            
            <form id="login-form">
                <!-- HANYA INPUT USERNAME -->
                <input type="text" id="username" placeholder="Masukkan Username" required autocomplete="off">
                <button type="submit" id="btn-login" class="btn-primary">MASUK</button>
            </form>
            <p id="pesan-error" style="color: red; font-size: 12px; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="app-screen" class="screen">
        <header class="app-header">
            <h2>Dashboard</h2>
            <div id="btn-logout">LOGOUT</div>
        </header>
        <main class="app-content">
            <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; text-align: center;">
                <h3 style="color: #10b981;">LOGIN BERHASIL!</h3>
                <p>Selamat datang di NET//CONTROL bos.</p>
                <p style="margin-top: 10px; font-size: 14px; color: gray;">Login sebagai: <span id="user-name-text" style="font-weight: bold; color: black;"></span></p>
            </div>
        </main>
    </div>

    <!-- SCRIPT LOGIC MANUAL -->
    <script>
        // ==========================================
        // SETTING USERNAME ANDA DI SINI BOS
        // ==========================================
        const USERNAME_VALID = "admin123"; 

        const formLogin = document.getElementById('login-form');
        const pesanError = document.getElementById('pesan-error');

        formLogin.addEventListener('submit', function(e) {
            e.preventDefault(); // Cegah refresh halaman (agar tidak muncul tanda ?)
            
            const inputUsername = document.getElementById('username').value;
            
            // Cek apakah username sama dengan settingan di atas
            if (inputUsername === USERNAME_VALID) {
                // Berhasil masuk
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('app-screen').classList.add('active');
                document.getElementById('user-name-text').innerText = inputUsername;
                pesanError.style.display = 'none';
            } else {
                // Gagal masuk
                pesanError.innerText = 'Username salah bos!';
                pesanError.style.display = 'block';
            }
        });

        // Proses Logout (Kembali ke awal)
        document.getElementById('btn-logout').addEventListener('click', function() {
            window.location.reload(); 
        });
    </script>
</body>
</html>
