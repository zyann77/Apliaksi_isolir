<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NET//CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Dasar Langsung Digabung Agar Pasti Jalan */
        :root { --bg-color: #f4f6f8; --card-bg: #ffffff; --text-main: #1e293b; --primary: #10b981; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }
        .login-box { margin: auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .login-box h1 { color: var(--text-main); }
        .login-box h1 span { color: var(--primary); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .app-header { display: flex; justify-content: space-between; padding: 15px; background: white; border-bottom: 1px solid var(--border); }
        .app-content { flex: 1; padding: 15px; overflow-y: auto; }
        #btn-logout { background: #ef4444; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold;}
    </style>
    
    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>NET<span>//</span>CONTROL</h1>
            <p style="color: gray; margin-bottom: 20px; font-size: 14px;">Admin Management System</p>
            
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="btn-login" class="btn-primary">LOGIN</button>
            </form>
            <p id="pesan-error" style="color: red; font-size: 12px; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="app-screen" class="screen">
        <header class="app-header">
            <h2>Dashboard</h2>
            <div id="btn-logout">LOGOUT</div>
        </header>
        <main class="app-content">
            <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; text-align: center;">
                <h3 style="color: #10b981;">LOGIN BERHASIL!</h3>
                <p>Selamat datang di NET//CONTROL bos.</p>
                <p style="margin-top: 10px; font-size: 14px; color: gray;">Email Anda: <span id="user-email-text"></span></p>
            </div>
        </main>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // 1. Konek ke Supabase
        const SUPABASE_URL = 'https://ufvwxdjpmetpvogtvnxj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmdnd4ZGpwbWV0cHZvZ3R2bnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzY2MjMsImV4cCI6MjEwMTY1MjYyM30.xLjQZ23oUEPvatUsKXYq-xzavbc5VoMJGZglgcpEGKU';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const formLogin = document.getElementById('login-form');
        const pesanError = document.getElementById('pesan-error');
        const btnLogin = document.getElementById('btn-login');

        // 2. Cek apakah sudah login sebelumnya
        async function checkLogin() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                tampilDashboard(session.user.email);
            }
        }
        checkLogin();

        // 3. Proses saat tombol login ditekan
        formLogin.addEventListener('submit', async function(e) {
            e.preventDefault(); // MENCEGAH HALAMAN REFRESH DAN MUNCUL TANDA '?'
            
            const emailValue = document.getElementById('email').value;
            const passwordValue = document.getElementById('password').value;
            
            btnLogin.innerText = 'MEMUAT...';
            pesanError.style.display = 'none';

            // Kirim data ke Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailValue,
                password: passwordValue,
            });

            if (error) {
                // Jika Gagal
                btnLogin.innerText = 'LOGIN';
                pesanError.innerText = 'Gagal: Email atau Password salah!';
                pesanError.style.display = 'block';
            } else {
                // Jika Berhasil
                tampilDashboard(data.user.email);
            }
        });

        // 4. Proses Logout
        document.getElementById('btn-logout').addEventListener('click', async function() {
            await supabase.auth.signOut();
            window.location.reload();
        });

        // 5. Fungsi pindah layar ke Dashboard
        function tampilDashboard(emailUser) {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('app-screen').classList.add('active');
            document.getElementById('user-email-text').innerText = emailUser;
        }
    </script>
</body>
</html>
