<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NET//CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 1. Load Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1 class="logo">NET<span>//</span>CONTROL</h1>
            <p class="subtitle">Admin Management System</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-primary">LOGIN</button>
            </form>
            <div class="footer-text">Created by Iyann</div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="screen">
        <header class="app-header">
            <h2 id="page-title">Dashboard</h2>
            <div class="user-avatar" id="btn-logout">OUT</div>
        </header>

        <main class="app-content">
            <!-- VIEW: DASHBOARD -->
            <section id="view-dashboard" class="view active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">TOTAL PELANGGAN</span>
                        <h3 id="stat-total">0</h3>
                    </div>
                    <div class="stat-card success">
                        <span class="stat-label">AKTIF</span>
                        <h3 id="stat-active">0</h3>
                    </div>
                </div>
            </section>

            <!-- VIEW: PELANGGAN -->
            <section id="view-customers" class="view">
                <div class="action-bar">
                    <input type="text" id="search-customer" placeholder="Cari pelanggan...">
                    <button id="btn-add-customer" class="btn-primary">+ Tambah</button>
                </div>
                <div id="customer-list" class="list-container">
                    Memuat data...
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-target="view-dashboard">
                <span class="label">Dashboard</span>
            </button>
            <button class="nav-item" data-target="view-customers">
                <span class="label">Pelanggan</span>
            </button>
        </nav>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Notifikasi</div>

    <!-- 2. Inisialisasi Supabase dan Logic Aplikasi -->
    <script>
        // INISIALISASI SUPABASE
        const SUPABASE_URL = 'https://ufvwxdjpmetpvogtvnxj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmdnd4ZGpwbWV0cHZvZ3R2bnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzY2MjMsImV4cCI6MjEwMTY1MjYyM30.xLjQZ23oUEPvatUsKXYq-xzavbc5VoMJGZglgcpEGKU';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // CEK SESI LOGIN SAAT HALAMAN DIBUKA
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // Jika sudah login, langsung ke dashboard
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('app-screen').classList.add('active');
                loadCustomers();
            }
        }
        checkUser();

        // LOGIC LOGIN ASLI (SUPABASE AUTH)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            
            btn.innerText = 'MEMUAT...';
            btn.disabled = true;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Gagal Login: Email atau Password salah!');
                btn.innerText = 'LOGIN';
                btn.disabled = false;
            } else {
                // Login Berhasil
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('app-screen').classList.add('active');
                loadCustomers();
            }
        });

        // LOGIC LOGOUT
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload(); // Refresh halaman kembali ke form login
        });

        // LOGIC NAVIGASI BAWAH
        document.querySelectorAll('.nav-item').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
                
                const target = button.closest('.nav-item');
                target.classList.add('active');
                document.getElementById(target.dataset.target).classList.add('active');
                document.getElementById('page-title').innerText = target.querySelector('.label').innerText;
            });
        });

        // LOGIC AMBIL DATA PELANGGAN
        async function loadCustomers() {
            const list = document.getElementById('customer-list');
            list.innerHTML = 'Memuat data...';

            const { data: customers, error } = await supabase
                .from('customers')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                list.innerHTML = `<div style="color:red; font-size:12px;">Error: ${error.message}</div>`;
                return;
            }

            if (customers.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:20px; font-size:14px;">Belum ada data pelanggan.</div>';
                document.getElementById('stat-total').innerText = 0;
                return;
            }

            list.innerHTML = '';
            customers.forEach(cust => {
                let statusColor = cust.isolation_status === 'ISOLATED' ? 'red' : 'green';
                list.innerHTML += `
                    <div class="customer-card" style="background:#fff; padding:15px; border-radius:8px; margin-bottom:10px; border:1px solid #ddd; display:flex; justify-content:space-between;">
                        <div>
                            <h4 style="margin:0 0 5px 0;">${cust.name}</h4>
                            <small style="color:gray;">${cust.customer_code} | PPPoE: ${cust.pppoe_username}</small><br>
                            <small style="color:${statusColor}; font-weight:bold;">● ${cust.isolation_status}</small>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('stat-total').innerText = customers.length;
        }
    </script>
</body>
</html>
